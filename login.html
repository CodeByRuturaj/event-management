<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Log in | EventHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="nav"></div>
    <div class="wrap">
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
            <form class="box" id="loginForm" novalidate style="width:100%">
                <h2>Log in</h2><label>Email<input name="email" type="email"></label><label>Password<input
                        name="password" type="password"></label>
                <div class="err" id="lerr"></div><button class="btn">Log in</button>
                <p class="muted">Admin demo: admin@event.com / admin123</p>
            </form>
            <form class="box" id="signupForm" novalidate style="width:100%">
                <h2>Create account</h2><label>Name<input name="name"></label><label>Email<input name="email"
                        type="email"></label><label>Password (6+ characters)<input name="password"
                        type="password"></label>
                <div class="err" id="serr"></div><button class="btn alt">Sign up</button>
            </form>
        </div>
    </div>
    <div id="foot"></div>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
