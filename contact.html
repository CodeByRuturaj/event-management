<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact | EventHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="nav"></div>
    <div class="wrap">
        <form class="box" id="contactForm" novalidate>
            <h2>Contact us</h2><label>Name<input name="name"></label><label>Email<input name="email"

        </form>
    </div>
    <div id="foot"></div>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
